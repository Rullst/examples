[package]
name = "saas"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"

[dependencies]
rullst = { version = "12.0.0", default-features = false, features = ["orm", "strict-postgres", "studio", "nexus", "auth", "capital"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rullst-orm = { version = "12.0.0", default-features = false, features = ["strict-postgres"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
rullst-auth = { version = "12.0.0" }
rullst-capital = { version = "12.0.0" }
rullst-security = { version = "12.0.0" }
rullst-mail = { version = "12.0.0" }
reqwest = { version = "0.13", features = ["form", "json", "query", "rustls"] }
hex = "0.4"
ring = "0.17"
sha2 = "0.11"
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "EventTarget", "Window"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("redis"))'] }

[workspace]
