[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"

[dependencies]
rullst = { version = "12.0.0", default-features = false, features = ["orm", "strict-sqlite", "studio", "nexus"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rullst-orm = { version = "12.0.0", features = ["strict-sqlite"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite"] }
rullst-security = { version = "12.0.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "EventTarget", "Window"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("redis"))'] }

[workspace]
