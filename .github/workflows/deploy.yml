name: Build and Publish OCI Container

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PUBLIC_NEXUS_DEMO_USERNAME: rullst_demo
  PUBLIC_NEXUS_DEMO_PASSWORD: RullstDemoAccess2026!

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify application and shared AI boundaries
        run: |
          cargo test --all-targets -j 2
          cargo test --manifest-path crates/blueprint-ai/Cargo.toml -j 2
          node --check crates/blueprint-ai/static/admin.js
          node --check scripts/browser-admin-smoke.mjs
          python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push OCI image with cargo-chef cache
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-azure:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Verify required production configuration
        run: python3 scripts/verify-deployment.py rullst-showcase --preflight

      - name: Deploy verified image to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: rullst-showcase
          resourceGroup: rullst-rg
          imageToDeploy: ghcr.io/rullst/examples@${{ needs.build-and-push.outputs.digest }}

      - name: Configure documented public sandbox credentials
        run: |
          az containerapp update --name rullst-showcase --resource-group rullst-rg --set-env-vars NEXUS_ADMIN_USERNAME="$PUBLIC_NEXUS_DEMO_USERNAME" NEXUS_ADMIN_PASSWORD="$PUBLIC_NEXUS_DEMO_PASSWORD" --only-show-errors --output none

      - name: Verify live public, Nexus and Studio AI
        run: python3 scripts/verify-deployment.py rullst-showcase --image 'ghcr.io/rullst/examples@${{ needs.build-and-push.outputs.digest }}'
