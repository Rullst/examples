name: AI safety and blueprint tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - crates/blueprint-ai/Cargo.toml
          - blueprints/lms/Cargo.toml
          - blueprints/portfolio/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.manifest }}
      - run: cargo test --manifest-path ${{ matrix.manifest }} --all-targets -j 2
      - run: node --check crates/blueprint-ai/static/admin.js
