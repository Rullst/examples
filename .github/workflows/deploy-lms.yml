name: Build and Publish LMS Blueprint OCI Container

on:
  push:
    branches: [ "main" ]
    paths:
      - 'blueprints/lms/**'
      - 'crates/blueprint-ai/**'
      - '.dockerignore'
      - 'scripts/verify-deployment.py'
      - 'scripts/test_verify_deployment.py'
      - 'scripts/browser-admin-smoke.mjs'
      - '.github/workflows/deploy-lms.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rullst/lms

jobs:
  build-and-push-lms:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blueprints/lms -> target
      - name: Verify application and shared AI boundaries
        run: |
          cargo test --manifest-path blueprints/lms/Cargo.toml --all-targets -j 2
          cargo test --manifest-path crates/blueprint-ai/Cargo.toml -j 2
          node --check crates/blueprint-ai/static/admin.js
          node --check scripts/browser-admin-smoke.mjs
          python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=sha

      - name: Build and push LMS OCI image with cargo-chef cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./blueprints/lms/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Verify required production configuration
        run: python3 scripts/verify-deployment.py rullst-lms --preflight

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: rullst-lms
          resourceGroup: rullst-rg
          imageToDeploy: ghcr.io/rullst/lms:${{ github.sha }}

      - name: Verify live public, Nexus and Studio AI
        run: python3 scripts/verify-deployment.py rullst-lms --image 'ghcr.io/rullst/lms:${{ github.sha }}'
