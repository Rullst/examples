name: Build and Publish Portfolio Blueprint OCI Container

on:
  push:
    branches: [ "main" ]
    paths:
      - 'blueprints/portfolio/**'
      - 'crates/blueprint-ai/**'
      - '.dockerignore'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rullst/portfolio

jobs:
  build-and-push-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blueprints/portfolio -> target
      - name: Verify application and shared AI boundaries
        run: |
          cargo test --manifest-path blueprints/portfolio/Cargo.toml --all-targets -j 2
          cargo test --manifest-path crates/blueprint-ai/Cargo.toml -j 2
          node --check crates/blueprint-ai/static/admin.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=sha

      - name: Build and push Portfolio OCI image with cargo-chef cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./blueprints/portfolio/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        uses: azure/login@v2
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        with:
          containerAppName: rullst-portfolio
          resourceGroup: rullst-rg
          imageToDeploy: ghcr.io/rullst/portfolio:${{ github.sha }}
