name: Backup SaaS Production Database

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

concurrency:
  group: saas-production-backup
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none

jobs:
  backup:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SAAS_PRODUCTION_BACKUPS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: saas-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate protected backup configuration
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SAAS_PRODUCTION_DATABASE_URL }}
          STORAGE_ACCOUNT: ${{ vars.SAAS_BACKUP_STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ vars.SAAS_BACKUP_CONTAINER }}
        run: |
          test "${DATABASE_URL#postgres}" != "$DATABASE_URL"
          test "${DATABASE_URL#*sslmode=require}" != "$DATABASE_URL"
          [[ "$STORAGE_ACCOUNT" =~ ^[a-z0-9]{3,24}$ ]]
          [[ "$STORAGE_CONTAINER" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]

      - name: Create, validate and restore-test an encrypted-in-transit PostgreSQL dump
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SAAS_PRODUCTION_DATABASE_URL }}
        run: |
          export BACKUP_NAME="saas-production-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}.dump"
          docker run --rm \
            --env DATABASE_URL \
            --env BACKUP_NAME \
            --volume "$PWD:/backup" \
            postgres:18-bookworm \
            sh -c 'pg_dump --format=custom --no-owner --no-acl --file="/backup/${BACKUP_NAME}" "$DATABASE_URL"'
          docker run --rm \
            --volume "$PWD:/backup" \
            postgres:18-bookworm \
            pg_restore --list "/backup/${BACKUP_NAME}" > /dev/null

          RESTORE_NETWORK="saas-restore-${GITHUB_RUN_ID}"
          RESTORE_CONTAINER="saas-restore-db-${GITHUB_RUN_ID}"
          cleanup_restore() {
            docker rm --force "$RESTORE_CONTAINER" > /dev/null 2>&1 || true
            docker network rm "$RESTORE_NETWORK" > /dev/null 2>&1 || true
          }
          trap cleanup_restore EXIT
          docker network create "$RESTORE_NETWORK" > /dev/null
          docker run --detach --name "$RESTORE_CONTAINER" \
            --network "$RESTORE_NETWORK" \
            --env POSTGRES_PASSWORD=restore-only-local \
            --env POSTGRES_DB=restore_validation \
            postgres:18-bookworm > /dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$RESTORE_CONTAINER" pg_isready \
              --username postgres --dbname restore_validation > /dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo '::error::Ephemeral restore database did not become ready.'
              exit 1
            fi
            sleep 2
          done
          docker run --rm \
            --network "$RESTORE_NETWORK" \
            --env PGPASSWORD=restore-only-local \
            --volume "$PWD:/backup:ro" \
            postgres:18-bookworm \
            pg_restore --exit-on-error --no-owner --no-acl \
              --dbname="postgresql://postgres@${RESTORE_CONTAINER}:5432/restore_validation" \
              "/backup/${BACKUP_NAME}"
          TABLE_COUNT="$(docker exec "$RESTORE_CONTAINER" psql \
            --username postgres --dbname restore_validation --tuples-only --no-align \
            --command="SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")"
          [[ "$TABLE_COUNT" =~ ^[0-9]+$ ]]
          test "$TABLE_COUNT" -gt 0
          cleanup_restore
          trap - EXIT
          echo "BACKUP_NAME=$BACKUP_NAME" >> "$GITHUB_ENV"

      - name: Log in to Azure with a short-lived production OIDC token
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Require a private container and upload the validated dump
        shell: bash
        env:
          STORAGE_ACCOUNT: ${{ vars.SAAS_BACKUP_STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ vars.SAAS_BACKUP_CONTAINER }}
        run: |
          PUBLIC_ACCESS="$(az storage container show \
            --account-name "$STORAGE_ACCOUNT" \
            --name "$STORAGE_CONTAINER" \
            --auth-mode login \
            --query 'properties.publicAccess' \
            --output tsv \
            --only-show-errors)"
          test -z "$PUBLIC_ACCESS"
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$STORAGE_CONTAINER" \
            --name "$BACKUP_NAME" \
            --file "$BACKUP_NAME" \
            --auth-mode login \
            --overwrite false \
            --only-show-errors \
            --output none
