name: Build Omni Desktop Application

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'blueprints/lms/omni-app/**'
      - '.github/workflows/omni-desktop.yml'

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI and Dependencies
        working-directory: ./blueprints/lms/omni-app
        run: npm install

      - name: Build Omni Desktop Application
        working-directory: ./blueprints/lms/omni-app
        run: npx tauri build
        env:
          CI: true

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rullst-LMS-Windows-Desktop
          path: |
            ./blueprints/lms/omni-app/target/release/bundle/nsis/*.exe
            ./blueprints/lms/omni-app/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Rullst LMS & Omni Desktop v1.0.0"
          body: |
            ## Rullst Omni Desktop Apps (v1.0.0)
            Official native desktop installers generated using Rullst Omni (`cargo rullst make:omni`).
            
            - **Target:** Windows x64 (.exe installer & .msi package)
            - **Framework:** Rullst Framework + Tauri 2.0
            - **Backend:** Azure Cloud Container
          files: |
            ./blueprints/lms/omni-app/target/release/bundle/nsis/*.exe
            ./blueprints/lms/omni-app/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
