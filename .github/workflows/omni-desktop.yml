name: Build Omni Desktop Application

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'blueprints/lms/omni-app/**'
      - '.github/workflows/omni-desktop.yml'

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI and Dependencies
        working-directory: ./blueprints/lms/omni-app
        run: npm install

      - name: Build Omni Desktop Application
        working-directory: ./blueprints/lms/omni-app
        run: npx tauri build
        env:
          CI: true

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rullst-LMS-Windows-Desktop
          path: ./blueprints/lms/omni-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
