name: Build and Deploy SaaS Staging

on:
  pull_request:
    paths:
      - 'blueprints/saas/**'
      - 'scripts/browser-saas-checkout-smoke.mjs'
      - '.github/workflows/deploy-saas-staging.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type deploy-saas-staging to authorize the Azure staging update'
        required: true
        type: string
      payments_mode:
        description: 'Keep disabled until the custom domain and Stripe webhook are ready'
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - test

concurrency:
  group: saas-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Reuse the repository's existing public GHCR package. A separate package
  # would default to private and the Container App intentionally has no
  # long-lived registry credential.
  IMAGE_NAME: rullst/examples
  CONTAINER_APP: rullst-saas-staging
  RESOURCE_GROUP: rullst-rg
  STRIPE_TEST_PRICE_ID: price_1UGen0CWTlr9100lrR2hLPXG
  AZURE_CORE_OUTPUT: none

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blueprints/saas -> target
      - name: Verify SaaS application
        run: |
          cargo fmt --manifest-path blueprints/saas/Cargo.toml --all -- --check
          cargo test --manifest-path blueprints/saas/Cargo.toml --locked --all-targets
          cargo clippy --manifest-path blueprints/saas/Cargo.toml --locked --all-targets -- -D warnings
          node --check scripts/browser-saas-checkout-smoke.mjs

  build-and-push:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'deploy-saas-staging' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "value=${REGISTRY}/${IMAGE_NAME}:saas-staging-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable staging image
        uses: docker/build-push-action@v6
        with:
          context: ./blueprints/saas
          file: ./blueprints/saas/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: saas-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Reject missing or malformed protected configuration
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SAAS_STAGING_DATABASE_URL }}
          APP_KEY: ${{ secrets.SAAS_STAGING_APP_KEY }}
          NEXUS_USERNAME: ${{ secrets.SAAS_STAGING_NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.SAAS_STAGING_NEXUS_PASSWORD }}
          STRIPE_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
        run: |
          test "${DATABASE_URL#postgres}" != "$DATABASE_URL"
          test "${#APP_KEY}" -ge 32
          test -n "$NEXUS_USERNAME"
          test "${#NEXUS_PASSWORD}" -ge 16
          test "${STRIPE_KEY#sk_test_}" != "$STRIPE_KEY"
          test "${STRIPE_WEBHOOK_SECRET#whsec_}" != "$STRIPE_WEBHOOK_SECRET"

      - name: Log in to Azure with a short-lived GitHub OIDC token
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Require a pre-provisioned staging Container App
        shell: bash
        run: |
          az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --only-show-errors --output none

      - name: Store protected values in Container Apps secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SAAS_STAGING_DATABASE_URL }}
          APP_KEY: ${{ secrets.SAAS_STAGING_APP_KEY }}
          NEXUS_USERNAME: ${{ secrets.SAAS_STAGING_NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.SAAS_STAGING_NEXUS_PASSWORD }}
          STRIPE_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
        run: |
          az containerapp secret set --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --secrets \
            database-url="$DATABASE_URL" \
            app-key="$APP_KEY" \
            nexus-username="$NEXUS_USERNAME" \
            nexus-password="$NEXUS_PASSWORD" \
            stripe-test-key="$STRIPE_KEY" \
            stripe-test-webhook-secret="$STRIPE_WEBHOOK_SECRET" \
            --only-show-errors --output none

      - name: Deploy fail-closed staging revision
        shell: bash
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          PAYMENTS_MODE: ${{ inputs.payments_mode }}
        run: |
          az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --min-replicas 0 --max-replicas 1 \
            --set-env-vars \
              RULLST_ENV=production \
              DEPLOYMENT_TIER=staging \
              NEXUS_TRUSTED_TLS_TERMINATION=azure-container-apps \
              MIGRATE_ON_STARTUP=true \
              PAYMENTS_MODE="$PAYMENTS_MODE" \
              BILLING_PROVIDER=stripe \
              BILLING_PRICE_ID="$STRIPE_TEST_PRICE_ID" \
              BILLING_EXPECTED_CURRENCY=BRL \
              BILLING_EXPECTED_AMOUNT_MINOR=100 \
              BILLING_REDIRECT_URL=https://saas-staging.rullst.win/dashboard \
              DATABASE_URL=secretref:database-url \
              APP_KEY=secretref:app-key \
              NEXUS_ADMIN_USERNAME=secretref:nexus-username \
              NEXUS_ADMIN_PASSWORD=secretref:nexus-password \
              STRIPE_SECRET_KEY=secretref:stripe-test-key \
              STRIPE_WEBHOOK_SECRET=secretref:stripe-test-webhook-secret \
            --only-show-errors --output none

      - name: Verify immutable revision and database readiness
        shell: bash
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          for attempt in $(seq 1 30); do
            ACTUAL_IMAGE="$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query 'properties.template.containers[0].image' --output tsv --only-show-errors)"
            FQDN="$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query 'properties.configuration.ingress.fqdn' --output tsv --only-show-errors)"
            if [ "$ACTUAL_IMAGE" = "$IMAGE" ] && curl --fail --silent --show-error --max-time 15 \
              --user-agent "Rullst-SaaS-Deployment-Healthcheck/1.0" \
              "https://${FQDN}/healthz" | grep --fixed-strings --quiet ready; then
              exit 0
            fi
            sleep 10
          done
          echo '::error::SaaS staging did not become ready; no secret or response body was logged.'
          exit 1

      - name: Verify authenticated Checkout handoff in Chromium
        if: ${{ inputs.payments_mode == 'test' }}
        run: node scripts/browser-saas-checkout-smoke.mjs https://saas-staging.rullst.win
